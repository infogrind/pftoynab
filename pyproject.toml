[project]
name = "pftoynab"
version = "0.1.0"
description = "Convert PostFinance CSV account exports into YNAB's file-based import format"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Marius Kleiner", email = "kleiner@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
pftoynab = "pftoynab:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
